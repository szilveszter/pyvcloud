[flake8]
import-order-style = google
application-import-names =
  pyvcloud.vcd
ignore = D100, D101, D102, D103, D105, D107, D104,
         D401, W503, W504

[tox]
envlist=flake8,unit

[testenv]
deps =
    -rtest-requirements.txt

[testenv:flake8]
deps = {[testenv]deps}
commands = flake8 pyvcloud/vcd tests/test_api_versions.py

[testenv:unit]
deps = -rrequirements.txt
commands = python -m unittest discover -s tests -p test_*.py
